server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000
file:
  # Altere este caminho conforme a estrutura de pastas da sua maquina.
  # Tambem pode ser sobrescrito pela variavel de ambiente FILE_UPLOAD_DIR.
  upload-dir: ${FILE_UPLOAD_DIR:./UploadDir}
spring:
  application:
    name: rest-with-spring-boot-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enable: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
logging:
  level:
    #root: WARN
    br.com.CarlosHenriqueSL: DEBUG
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true