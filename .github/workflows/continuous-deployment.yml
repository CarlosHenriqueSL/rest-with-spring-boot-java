name: Continuous Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - "main"
      - "teste"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN}}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Verify Docker
        run: docker info

      - name: Build Application .jar
        working-directory: ./rest-with-spring-boot-java
        run: mvn clean package
        env:
          DOCKER_API_VERSION: "1.48"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: rest-with-spring-boot-java/target/surefire-reports/

      - name: Docker Compose Build
        run: docker compose build
        env:
          MYSQL_ROOT_PASSWORD: ci-build-only-root-password
          MYSQL_PASSWORD: ci-build-only-password

      - name: Tag and Push Docker Image to Amazon Container Registry - ECR
        run: |
          docker tag carloshenriquesl/rest-with-spring-boot-java:latest ${{ secrets.IMAGE_REPO_URL }}:latest
          docker tag carloshenriquesl/rest-with-spring-boot-java:latest ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}
          
          docker push ${{ secrets.IMAGE_REPO_URL }}:latest
          docker push ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ secrets.TASK_DEFINITION_NAME }} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ secrets.IMAGE_REPO_URL }}:latest

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.SERVICE_NAME }}
          cluster: ${{ secrets.CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag carloshenriquesl/rest-with-spring-boot-java:latest ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:latest
          docker tag carloshenriquesl/rest-with-spring-boot-java:latest ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:${{ github.run_id }}

          docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:${{ github.run_id }}