name: Continuous Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - "main"
      - "teste"

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.REGISTRY_INFO }}
  IMAGE_NAME: rest-with-spring-boot-java
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGION: us-east1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Login to Google Cloud Platform
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker Authentication for Google Cloud Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      #- name: Configure AWS credentials
      #  uses: aws-actions/configure-aws-credentials@v4
      #  with:
      #    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #    aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      #- name: Login to Amazon ECR
      #  id: login-ecr
      #  uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Build Application .jar
        working-directory: ./rest-with-spring-boot-java
        run: mvn clean package
        env:
          DOCKER_API_VERSION: "1.48"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: rest-with-spring-boot-java/target/surefire-reports/

      - name: Docker Compose Build
        run: docker compose build
        env:
          MYSQL_ROOT_PASSWORD: ci-build-only-root-password
          MYSQL_PASSWORD: ci-build-only-password

      #- name: Tag and Push Docker Image to Amazon Container Registry - ECR
      #  run: |
      #    docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:latest ${{ secrets.IMAGE_REPO_URL }}:latest
      #    docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java:latest ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}
      #
      #    docker push ${{ secrets.IMAGE_REPO_URL }}:latest
      #    docker push ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}

      #- name: Download task definition
      #  run: |
      #    aws ecs describe-task-definition --task-definition ${{ secrets.TASK_DEFINITION_NAME }} --query taskDefinition > task-definition.json

      #- name: Fill in the new image ID in the Amazon ECS task definition
      #  id: task-def
      #  uses: aws-actions/amazon-ecs-render-task-definition@v1
      #  with:
      #    task-definition: task-definition.json
      #    container-name: ${{ secrets.CONTAINER_NAME }}
      #    image: ${{ secrets.IMAGE_REPO_URL }}:latest

      #- name: Deploy Amazon ECS task definition
      #  uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #  with:
      #    task-definition: ${{ steps.task-def.outputs.task-definition }}
      #    service: ${{ secrets.SERVICE_NAME }}
      #    cluster: ${{ secrets.CLUSTER_NAME }}
      #    wait-for-service-stability: true

      - name: Push to Google Cloud Artifact Registry
        env:
          LOCAL_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java
        run: |
          docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:latest"
          docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:${{ github.run_id }}"

          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:${{ github.run_id }}"

      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy rest-with-spring-boot-java \
            --project "$PROJECT_ID" \
            --image "$REGISTRY/$IMAGE_NAME:latest" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated

      - name: Push to Docker Hub Container Registry
        env:
          LOCAL_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-java
        run: |
          docker tag $LOCAL_IMAGE:latest $LOCAL_IMAGE:${{ github.run_id }}

          docker push $LOCAL_IMAGE:latest
          docker push $LOCAL_IMAGE:${{ github.run_id }}