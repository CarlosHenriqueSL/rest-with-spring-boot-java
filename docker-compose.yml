services:
  db:
    image: mysql:9.1.0
    # command: mysqld --default_authentication_plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot_java
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - carlos-network

  rest-with-spring-boot-java:
    image: carloshenriquesl/rest-with-spring-boot-java
    build: ./rest-with-spring-boot-java
    working_dir: /rest-with-spring-boot-java
    ports:
      - 80:80
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rest_with_spring_boot_java?useTimezone=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: admin123
    command: mvn spring-boot:run
    depends_on:
      - db
    networks:
      - carlos-network

networks:
  carlos-network:
    driver: bridge
